[package]
name = "egui-winit"
version = "0.37.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
description = "egui-winit 0.37 ported to winit 0.31, from github.com/mockydevs/egui feat/winit-031-review"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unexpected_cfgs = "allow"

[features]
default = ["links", "wayland", "winit/default", "x11"]
bytemuck = ["egui/bytemuck", "dep:bytemuck"]
links = ["webbrowser"]
serde = ["egui/serde", "dep:serde"]
wayland = ["winit/wayland", "bytemuck"]
x11 = ["winit/x11", "bytemuck"]

[dependencies]
egui = { version = "0.37.0", default-features = false }
log = { version = "0.4", features = ["std"] }
profiling = { version = "1.0", default-features = false }
raw-window-handle = "0.6.2"
url = "2.5"
web-time = "1.1"
winit = { version = "=0.31.0-beta.4", default-features = false }

bytemuck = { version = "1.25", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
webbrowser = { version = "1.2.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSEvent",
  "NSResponder",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
pollster = "0.2.5"
