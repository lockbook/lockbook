[package]
name = "lockbook-desktop"
version = "26.4.22"
edition = "2021"

[dependencies]
arboard = { version = "3.6", features = ["image", "wayland-data-control"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dark-light = "2.0.0"
egui = "0.32.3"
egui_extras = { version = "0.32.3", features = ["image"] }
egui-winit = { version = "0.32.3", default-features = false, features = ["links", "wayland", "x11"] }
egui_wgpu_renderer = { path = "../../libs/content/egui_wgpu_renderer" }
env_logger = "0.10"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
] }
lb = { package = "lb-rs", path = "../../libs/lb/lb-rs", default-features = false }
lbeguiapp = { package = "lockbook-egui", path = "../egui", default-features = false, features = ["egui_wgpu_renderer"] }
log = "0.4"
rfd = { version = "0.11.4", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.140", features = ["derive"] }
serde_json = "1.0.82"
pollster = "0.4"
wgpu = "25"
workspace = { path = "../../libs/content/workspace" }
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std"] }
raw-window-handle = "0.6"
