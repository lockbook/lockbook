[package]
name = "lockbook-egui"
version = "26.7.17"
edition = "2021"

[dependencies]
egui = "0.32.3"
egui_wgpu_renderer = { path = "../../libs/content/egui_wgpu_renderer", optional = true }
egui_extras = { version = "0.32.3", features = ["image"] }
serde = { version = "1.0.140", features = ["derive"] }
serde_json = "1.0.82"
workspace = { path = "../../libs/content/workspace" }
lb = { package = "lb-rs", path = "../../libs/lb/lb-rs" }
log = "0.4"

[features]
default = ["egui_wgpu_renderer"]
egui_wgpu_renderer = ["dep:egui_wgpu_renderer"]

[lib]
name = "lockbook_egui"
path = "src/lib.rs"
required-features = ["egui_wgpu_renderer"]

[dev-dependencies]
egui_kittest = { version = "0.32", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
