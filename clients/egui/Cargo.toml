[package]
name = "lockbook-egui"
version = "26.7.17"
edition = "2021"

[dependencies]
egui = "0.32.3"
egui_wgpu_renderer = { path = "../../libs/content/egui_wgpu_renderer", optional = true }
eframe = { version = "0.32.3", default-features = false, features = [
    "wgpu",
], optional = true } # dependency for binary only
egui_extras = { version = "0.32.3", features = ["image"] }
env_logger = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.140", features = ["derive"] }
serde_json = "1.0.82"
workspace = { path = "../../libs/content/workspace" }

[features]
default = ["eframe"]
eframe = ["dep:eframe"]
egui_wgpu_renderer = ["dep:egui_wgpu_renderer"]

[lib]
name = "lockbook_egui"
path = "src/lib.rs"
required-features = ["egui_wgpu_renderer"]

[[bin]]
name = "lockbook-egui"
path = "src/main.rs"
required-features = ["eframe"]
