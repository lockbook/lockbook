[workspace]

resolver = "2"

members = [
    "libs/lb/lb-rs",
    "libs/lb/test_utils",
    "libs/content/workspace",
    "libs/content/workspace-ffi",
    "libs/lb-fs",
    "server",
    "clients/cli",
    "clients/linux",
    "clients/windows",
    "clients/desktop",
    "clients/admin",
    "utils/lbdev",
    "utils/winstaller",
    "utils/metrics",
    "public-site/trunk",
    "libs/lb/lb-c",
    "libs/lb/lb-java",
    "libs/content/egui_wgpu_renderer",
]

# restore for big binaries but good backtraces
# [profile.release]
# debug = true
# [profile.bench]
# debug = true

# release-equivalent with debug symbols, for `samply` / `cargo flamegraph`.
[profile.profiling]
inherits = "release"
debug = true

# optimize all dependencies in dev mode so debug builds run at reasonable speed
# see https://bevy-cheatbook.github.io/pitfalls/performance.html
[profile.dev.package."*"]
opt-level = 3

# tests spend their time in our own code (the editor property tests), which
# opt-level 0 makes about 3x slower; dev builds keep their fast rebuilds
[profile.test]
opt-level = 1

[patch.crates-io]
typst = { git = "https://github.com/lockbook/typst", rev = "9b98d3705845cf85e2f1923335d3077abd87259a" }
typst-eval = { git = "https://github.com/lockbook/typst", rev = "9b98d3705845cf85e2f1923335d3077abd87259a" }
