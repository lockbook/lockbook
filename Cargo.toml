typst-layout = { git = "https://github.com/lockbook/typst", rev = "9b98d3705845cf85e2f1923335d3077abd87259a" }
typst-library = { git = "https://github.com/lockbook/typst", rev = "9b98d3705845cf85e2f1923335d3077abd87259a" }
typst-macros = { git = "https://github.com/lockbook/typst", rev = "9b98d3705845cf85e2f1923335d3077abd87259a" }
typst-realize = { git = "https://github.com/lockbook/typst", rev = "9b98d3705845cf85e2f1923335d3077abd87259a" }
typst-svg = { git = "https://github.com/lockbook/typst", rev = "9b98d3705845cf85e2f1923335d3077abd87259a" }
