name: Windows Store Package

on:
  # releases submit automatically; a manual dispatch just builds unless you opt in
  workflow_dispatch:
    inputs:
      submit:
        description: submit the bundle to the Microsoft Store
        type: boolean
        default: false
  workflow_call:
    inputs:
      submit:
        type: boolean
        default: true

jobs:
  pack-x64:
    if: github.repository == 'lockbook/lockbook'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack x64 MSIX
        run: cargo run -p lbdev -- releaser windows store-pack
      - name: Upload x64 MSIX
        uses: actions/upload-artifact@v4
        with:
          name: msix-x64
          path: windows-build/msix/lockbook-x64.msix

  pack-arm64:
    if: github.repository == 'lockbook/lockbook'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Pack arm64 MSIX
        run: cargo run -p lbdev -- releaser windows store-pack-arm
      - name: Upload arm64 MSIX
        uses: actions/upload-artifact@v4
        with:
          name: msix-arm64
          path: windows-build/msix/lockbook-arm64.msix

  bundle:
    if: github.repository == 'lockbook/lockbook'
    needs: [pack-x64, pack-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download MSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: msix-*
          merge-multiple: true
          path: windows-build/msix
      - name: Bundle MSIX packages
        run: cargo run -p lbdev -- releaser windows store-bundle
      - name: Upload msixbundle
        uses: actions/upload-artifact@v4
        with:
          name: lockbook-msixbundle
          path: windows-build/Lockbook.msixbundle

  submit:
    if: github.repository == 'lockbook/lockbook' && inputs.submit
    needs: bundle
    runs-on: windows-latest
    steps:
      - name: Download msixbundle
        uses: actions/download-artifact@v4
        with:
          name: lockbook-msixbundle
          path: windows-build
      - name: Install the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Configure store credentials
        # quoted: an unquoted client secret is a bare powershell token, so any of ( ) { } @ $ & ; , in it
        # would be parsed rather than passed through
        run: >-
          msstore reconfigure
          --tenantId '${{ secrets.AZURE_AD_TENANT_ID }}'
          --sellerId '${{ secrets.SELLER_ID }}'
          --clientId '${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}'
          --clientSecret '${{ secrets.AZURE_AD_APPLICATION_SECRET }}'
      - name: Submit to the Microsoft Store
        run: >-
          msstore publish '${{ github.workspace }}/windows-build/Lockbook.msixbundle'
          -id ${{ vars.STORE_PRODUCT_ID }}
