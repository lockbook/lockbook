<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>lockbook wasm</title>
    <!--
      This file exists only to give Trunk a target. The rendered HTML is
      discarded by build.sh; the site consumes public-site.js and
      public-site_bg.wasm from static/wasm/ directly.

      data-wasm-opt="z" matters: the deployed binary's `producers` custom
      section lists only rustc / walrus / wasm-bindgen, so wasm-opt has never
      run on it. -Oz also strips the ~1.9 MB `name` section.
    -->
    <link data-trunk rel="rust" data-wasm-opt="z" />
</head>
<body></body>
</html>
