[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.'cfg(all(target_arch = "aarch64", not(target_os = "macos")))']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]

# Binaries and tests on a Mac link the Apple Intelligence bridge, which is
# Swift and finds its runtime by this path.
[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8", "-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

[target.'cfg(all(target_arch = "x86_64", target_os = "macos"))']
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
