[package]
name = "workspace"
version = "26.10.31"
edition = "2021"

[lib]
name = "workspace_rs"

[features]
default = ["extra-grammars"]
# grammars past the core set, for builds that can afford their size
extra-grammars = [
    "dep:tree-sitter-asm",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-cmake",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-dart",
    "dep:tree-sitter-diff",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-elm",
    "dep:tree-sitter-erlang",
    "dep:tree-sitter-gleam",
    "dep:tree-sitter-haskell",
    "dep:tree-sitter-ini",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-make",
    "dep:tree-sitter-nix",
    "dep:tree-sitter-objc",
    "dep:tree-sitter-php",
    "dep:tree-sitter-powershell",
    "dep:tree-sitter-r",
    "dep:tree-sitter-regex",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-xml",
    "dep:tree-sitter-zig",
]

[dependencies]
basic-human-duration = "0.2.0"
bezier-rs = "0.2.0"
chrono = "0.4"
db-rs = "0.3.7"
color-art = "0.3.9"
colored = "2"
colors-transform = "0.2.11"
comrak = { version = "0.57", default-features = false, features = [
    "shortcodes",
] }
emojis = "0.9.0"
egui = { version = "0.37.0", features = ["serde"] }
egui_animation = "0.14.0"
egui_wgpu_renderer = { path = "../egui_wgpu_renderer" }
epaint = { version = "0.37", features = ["color-hex"] }
futures = "0.3.30"
glam = "0.22.0"
glyphon = "0.12.0"
hayro = "0.4.0"
# Annoyingly egui depends on a version match here for feature toggling reasons
image = "0.25.9"
indexmap = { version = "2.5.0", features = ["rayon"] }
lazy_static = "1.4.0"
lb-fonts = { git = "https://github.com/lockbook/lb-fonts" }
lb-rs = { path = "../../lb/lb-rs" }
linkify = "0.10.0"
lyon = "1.0.1"
rand = "0.8.5"
unicode-linebreak = "0.1"
unicode-script = "0.5"
rayon = "1.10.0"
regex = "1.10.6"
resvg = "0.41.0"
scraper = "0.14"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.82"
similar = "2.6.0"
sys-locale = "0.3"
content_inspector = "0.2"
time = "0.3.20"
ttf-parser = "0.20"
tracing = "0.1.5"
unicode-segmentation = "1.10.0"
unicode-properties = "0.1.4"
url = "2.2"
urlencoding = "2.1.3"
web-time = "1.1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { version = "0.11.1", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
    "stream",
] }
tokio = { version = "1.0", features = ["full"] }
num_cpus = "1.15"
memmap2 = "0.9"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-asm = { version = "0.24.0", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-cmake = { version = "0.7.6", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-dart = { version = "0.3.0", optional = true }
tree-sitter-diff = { version = "0.1.0", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-elm = { version = "5.9.4", optional = true }
tree-sitter-erlang = { version = "0.21.0", optional = true }
tree-sitter-gleam = { version = "1.0.0", optional = true }
tree-sitter-haskell = { version = "0.24.1", optional = true }
tree-sitter-ini = { version = "1.4.0", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-make = { version = "1.1.1", optional = true }
tree-sitter-nix = { version = "0.3.0", optional = true }
tree-sitter-objc = { version = "3.0.2", optional = true }
tree-sitter-php = { version = "0.25.1", optional = true }
tree-sitter-powershell = { version = "0.26.6", optional = true }
tree-sitter-r = { version = "1.3.0", optional = true }
tree-sitter-regex = { version = "0.25.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-scala = { version = "0.26.3", optional = true }
tree-sitter-swift = { version = "0.7.4", optional = true }
tree-sitter-xml = { version = "0.7.0", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = "0.4.50"
reqwest = { version = "0.11.1", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.4"
raw-window-handle = "0.6"
jni = "0.21.0"
pollster = "0.2"
