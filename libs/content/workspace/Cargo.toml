[package]
name = "workspace"
version = "26.10.23"
edition = "2021"

[lib]
name = "workspace_rs"

[dependencies]
base64 = "0.22"
basic-human-duration = "0.2.0"
bezier-rs = "0.2.0"
chrono = "0.4"
db-rs = "0.3.7"
color-art = "0.3.9"
colored = "2"
colors-transform = "0.2.11"
comrak = { version = "0.57", default-features = false, features = [
    "shortcodes",
] }
emojis = "0.9.0"
egui = { version = "0.37.0", features = ["serde"] }
egui_animation = "0.14.0"
egui_wgpu_renderer = { path = "../egui_wgpu_renderer" }
epaint = { version = "0.37", features = ["color-hex"] }
futures = "0.3.30"
glam = "0.22.0"
glyphon = "0.12.0"
hayro = "0.4.0"
# Annoyingly egui depends on a version match here for feature toggling reasons
image = "0.25.9"
indexmap = { version = "2.5.0", features = ["rayon"] }
lazy_static = "1.4.0"
lb-fonts = { git = "https://github.com/lockbook/lb-fonts" }
lb-rs = { path = "../../lb/lb-rs" }
linkify = "0.10.0"
lyon = "1.0.1"
rand = "0.8.5"
unicode-linebreak = "0.1"
unicode-script = "0.5"
rayon = "1.10.0"
regex = "1.10.6"
merman = { version = "0.9.1", default-features = false, features = [
    "all-diagrams",
    "svg",
] }
resvg = "0.47.0"
roxmltree = "0.21.1"
scraper = "0.14"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.82"
similar = "2.6.0"
sys-locale = "0.3"
content_inspector = "0.2"
syntect-assets = { default-features = false, version = "0.23", features = [
    "regex-fancy",
] }
syntect = { default-features = false, version = "5.0", features = [
    "default-fancy",
] }
time = "0.3.20"
ttf-parser = "0.20"
tracing = "0.1.5"
unicode-segmentation = "1.10.0"
unicode-properties = "0.1.4"
url = "2.2"
urlencoding = "2.1.3"
web-time = "1.1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { version = "0.11.1", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
    "stream",
] }
tokio = { version = "1.0", features = ["full"] }
num_cpus = "1.15"
memmap2 = "0.9"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = "0.4.50"
reqwest = { version = "0.11.1", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.4"
raw-window-handle = "0.6"
jni = "0.21.0"
pollster = "0.2"
