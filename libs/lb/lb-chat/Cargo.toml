[package]
name = "lb-chat"
version = "26.9.25"
edition = "2021"
description = "The headless chat driver: runs a turn against a provider and settles it into a .chat document."
repository = "https://github.com/lockbook/lockbook"
license = "BSD-3-Clause"

[dependencies]
chrono = "0.4"
futures = "0.3.30"
lb-rs = { version = "26", path = "../lb-rs" }
reqwest = { version = "0.11.1", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
base64 = "0.13.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.41.0"
scraper = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.5"
uuid = { version = "1.2.2", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
lb-apple-ai = { path = "../../apple-ai" }

[dev-dependencies]
test_utils = { path = "../test_utils" }
