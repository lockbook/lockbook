[package]
name = "lb-rs"
version = "26.10.31"
edition = "2021"
description = "The rust library for interacting with your lockbook."
repository = "https://github.com/lockbook/lockbook"
homepage = "https://lockbook.net"
license = "BSD-3-Clause"
keywords = ["notes", "encryption", "productivity", "automation", "security"]

[lib]
name = "lb_rs"
crate-type = ["lib", "staticlib", "cdylib"]
bench = false

[features]
# Runs the integration tests against a server in this process instead of over HTTP.
in-process-tests = ["test_utils/in-process"]

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.13.0"
basic-human-duration = "0.2.0"
bezier-rs = "0.2.0"
bincode = "1.3.3"
bip39-dict = "0.1.3"
bytes = "1"
chrono = "0.4"
crossbeam = "0.8.1"
db-rs-derive = "0.3.7"
db-rs = "0.4.2"
db-rs-old = { package = "db-rs", version = "=0.3.7" }
flate2 = "1.0"
futures = "0.3.30"
getrandom = { version = "0.2", features = ["js"] }
glam = "0.22.0"
hmac = "0.11.0"
http = "0.2.6"
indexmap = { version = "2.5.0", features = ["rayon"] }
libsecp256k1 = "0.7.1"
qrcode-generator = "4.1.6"
rand = "0.8.4"
reqwest = { version = "0.11.1", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.44"
sha2 = "0.9.9"
similar = { version = "2.7.0", features = ["unicode", "wasm32_web_time"] }
time = "0.3.20"
tracing-subscriber = "0.3.9"
tracing = "0.1.5"
unicode-segmentation = "1.10.0"
nucleo = "0.5"
usvg = "0.47.0"
uuid = { version = "1.2.2", features = ["v4", "serde", "js"] }
web-time = "1.1.0"
strum = "0.28.0"
strum_macros = "0.28"

[target.'cfg(target_os = "android")'.dependencies]
tracing-logcat = "=0.1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }


[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", features = [
    "sync",
    "macros",
    "io-util",
    "rt",
    "time",
] }
wasm-bindgen-futures = "0.4.50"
tracing-wasm = "0.2.1"


[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["full"] }
tracing-perfetto-file = "=0.1.1"
tracing-appender = "0.2"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }
itertools = "0.10.1"
rand = "0.8.4"
tempfile = { version = "3.1.0" }
test_utils = { path = "../test_utils" }
# the release that reads V2 metadata, which keeps syncing alongside the one that writes it
lb-rs-read = { package = "lb-rs", git = "https://github.com/lockbook/lockbook", rev = "66b7a9585a9cc255144d5cce3e8c3b3376f894fe" }

[[bench]]
name = "bench_main"
harness = false
